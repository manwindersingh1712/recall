[project]
name = "recall"
version = "0.1.0"
description = "Recall: a hybrid-search memory engine on PostgreSQL + pgvector"
readme = "README.md"
authors = [
    { name = "Manwinder Singh", email = "manwindersingh1712@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]",
    "psycopg-pool",
    "pgvector",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "beautifulsoup4",
    "python-frontmatter",
    "fastembed",
]

[project.scripts]
recall = "recall.cli:app"

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[tool.pytest.ini_options]
markers = ["slow: uses the real embedding model"]
addopts = "-ra"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
